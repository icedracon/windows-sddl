name: Fuzz

on:
  push:
    paths:
      - src/**
      - fuzz/**
      - .github/workflows/fuzz.yml
  pull_request:
    paths:
      - src/**
      - fuzz/**
      - .github/workflows/fuzz.yml
  schedule:
    - cron: "13 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-hostile-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: cargo +nightly fuzz run parse -- -max_total_time=60
