[package]
name = "windows-sddl"
version = "0.1.2"
edition = "2021"
rust-version = "1.74"
description = "Pure-Rust parser for Windows security descriptors, ACLs, ACEs, SIDs, and AD rights for DFIR and security research."
license = "MIT"
repository = "https://github.com/icedracon/windows-sddl"
documentation = "https://docs.rs/windows-sddl"
readme = "README.md"
keywords = ["windows", "sddl", "acl", "security", "active-directory"]
categories = ["parser-implementations", "os::windows-apis"]
exclude = ["/fuzz"]

[dependencies]
bitflags = "2"
thiserror = "2"

[badges]
maintenance = { status = "actively-developed" }
